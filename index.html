<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hybrid Games - Registration</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ccff00; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { background: #ccff00; color: #000; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; }
        button:disabled { background: #555; cursor: not-allowed; }
        .instapay { background: #262626; border: 1px dashed #ccff00; padding: 10px; border-radius: 6px; text-align: center; margin-top: 15px; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>THE HYBRID GAMES</h2>
    <p style="text-align:center; color:#bbb;">استمارة التسجيل الرسمية</p>

    <form id="regForm">
        <label>الاسم بالكامل *</label>
        <input type="text" id="athleteName" required>

        <label>السن *</label>
        <input type="number" id="age" required>

        <label>مقاس הـ T-Shirt *</label>
        <select id="tshirt" required>
            <option value="">اختر المقاس</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
        </select>

        <label>اسم الفريق (إن وجد)</label>
        <input type="text" id="teamName">

        <label>اسم الجيم / الـ Box *</label>
        <input type="text" id="boxName" required>

        <label>رقم الواتساب *</label>
        <input type="tel" id="phone" required>

        <label>البريد الإلكتروني *</label>
        <input type="email" id="email" required>

        <label>الفئة المشاركة *</label>
        <select id="category" required>
            <option value="">اختر الفئة</option>
            <option value="Scaled">Scaled</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Rx">Rx</option>
            <option value="Masters">Masters</option>
        </select>

        <div class="instapay">
            <p style="margin:0; font-size: 14px;">الدفع عبر InstaPay على العنوان:</p>
            <strong style="color: #ccff00;">kabdalla93_@instapay</strong>
        </div>

        <label>صورة إيصال التحويل *</label>
        <input type="file" id="receipt" accept="image/*" required>

        <button type="submit" id="submitBtn">تأكيد التسجيل</button>
    </form>

    <div id="status"></div>
</div>

<script>
    // ⚠️ استبدل الرابط أدناه برابط الـ Web App المنسوخ من Google Apps Script
    const SCRIPT_URL = "استبدل_هذا_النص_برابط_GOOGLE_WEB_APP_URL";

    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.innerText = "جاري إرسال البيانات والملف...";
        status.style.color = "#fff";

        try {
            const fileInput = document.getElementById('receipt');
            let receiptBase64 = "";
            let receiptName = "";

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                receiptName = file.name;
                receiptBase64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                athleteName: document.getElementById('athleteName').value,
                age: document.getElementById('age').value,
                tshirt: document.getElementById('tshirt').value,
                teamName: document.getElementById('teamName').value,
                boxName: document.getElementById('boxName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                category: document.getElementById('category').value,
                receiptBase64: receiptBase64,
                receiptName: receiptName
            };

            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            const resData = await response.json();

            if (resData.status === "success") {
                status.innerText = "تم التسجيل بنجاح! شكرًا لمشاركتك.";
                status.style.color = "#ccff00";
                document.getElementById('regForm').reset();
            } else {
                throw new Error(resData.message || "حدث خطأ أثناء الحفظ");
            }
        } catch (err) {
            status.innerText = "فشل الإرسال، يرجى المحاولة لاحقًا.";
            status.style.color = "#ff4d4d";
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
